<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>예수님 얼굴 시안 — 항상기쁨</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans KR', sans-serif; background: #EEF1F5; color: #1C2430; padding: 22px 18px 70px; }
  .head { max-width: 1240px; margin: 0 auto 20px; }
  h1 { font-size: 21px; font-weight: 700; margin-bottom: 6px; }
  .head p { font-size: 13px; color: #5A6675; line-height: 1.75; }
  .head b { color: #1C2430; }

  .grid { max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 16px; }
  .cell {
    flex: 0 0 232px; background: #fff; border-radius: 16px; padding: 14px 12px 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08); text-align: center;
  }
  .cell svg { display: block; margin: 0 auto; }
  .cell .no {
    display: inline-block; background: #1C2430; color: #fff;
    font-size: 12px; font-weight: 700; padding: 3px 11px; border-radius: 50px; margin-bottom: 8px;
  }
  .cell h2 { font-size: 14px; font-weight: 700; margin: 8px 0 4px; }
  .cell p { font-size: 11.5px; color: #6B7684; line-height: 1.6; }
  .zoom { background: #F7F9FC; border-radius: 12px; padding: 4px 0 0; margin-bottom: 6px; }
</style>
</head>
<body>

<div class="head">
  <h1>예수님 얼굴 시안 6개</h1>
  <p>
    몸(팔 벌린 자세)은 전부 같고 <b>얼굴만 다르게</b> 그렸어. 번호로 알려주면 그걸로 확정할게.<br>
    섞어도 돼 — 예: <b>“3번 얼굴형 + 5번 수염”</b> 같은 식으로.
  </p>
</div>

</html>
