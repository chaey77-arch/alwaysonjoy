<!-- 캐릭터 "예수님" — 두 팔 활짝 벌려 안아주시는 모습
     참고 스타일: 크림색 겉옷 + 테라코타 띠 · 갈색 외곽선 ·
     풍성한 곱슬머리와 수염 · 웃는 반달 눈 · 활짝 웃는 입 · 펼친 손 · 샌달 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="jz-robe" x1="25%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%"   stop-color="#FBF4DE"/>
      <stop offset="100%" stop-color="#EFE2BE"/>
    </linearGradient>
    <linearGradient id="jz-sash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#CE6046"/>
      <stop offset="100%" stop-color="#AE4530"/>
    </linearGradient>
    <linearGradient id="jz-skin" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%"   stop-color="#FCE3C8"/>
      <stop offset="100%" stop-color="#F6D0AC"/>
    </linearGradient>
    <linearGradient id="jz-hair" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%"   stop-color="#B07A4E"/>
      <stop offset="55%"  stop-color="#9C6740"/>
      <stop offset="100%" stop-color="#875530"/>
    </linearGradient>
    <linearGradient id="jz-sandal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#D9A05B"/>
      <stop offset="100%" stop-color="#BD8342"/>
    </linearGradient>
  </defs>

  <!-- ═══ 배경 하트 (레퍼런스의 주황 하트) ═══ -->
  <g stroke="#F2652F" fill="none" stroke-width="3.4" stroke-linecap="round">
    <!-- 왼쪽 윤곽 하트 2개 + 꼬리 -->
    <path d="M26 30 C26 24, 32 21, 35 25 C38 21, 44 24, 44 30 C44 36, 35 42, 35 42 C35 42, 26 36, 26 30 Z"/>
    <path d="M12 48 C12 43, 17 41, 19.5 44 C22 41, 27 43, 27 48 C27 53, 19.5 58, 19.5 58 C19.5 58, 12 53, 12 48 Z"/>
    <path d="M46 34 C56 40, 58 52, 52 62"/>
    <path d="M30 60 C38 64, 42 72, 41 80" stroke-width="3"/>
  </g>
  <!-- 오른쪽 채워진 하트 + 점선 궤적 -->
  <path d="M164 8 C164 1, 171 -2, 175 2.5 C179 -2, 186 1, 186 8 C186 16, 175 25, 175 25 C175 25, 164 16, 164 8 Z"
        fill="#F2652F"/>
  <g stroke="#F2652F" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="7 6">
    <path d="M170 30 C156 38, 148 50, 150 62"/>
  </g>
  <circle cx="152" cy="40" r="3.4" fill="none" stroke="#F2652F" stroke-width="3"/>

  <!-- ═══ 머리 (뒤 — 풍성한 곱슬 실루엣, 아래는 물결 ) ═══ -->
  <path d="M100 16
           C72 16, 56 34, 56 60
           C56 74, 55 86, 59 94
           C62 100, 69 99, 71 93
           C73 100, 80 101, 83 94
           C86 100, 93 101, 96 95
           C97 99, 103 99, 104 95
           C107 101, 114 100, 117 94
           C120 101, 127 100, 129 93
           C131 99, 138 100, 141 94
           C145 86, 144 74, 144 60
           C144 34, 128 16, 100 16 Z"
        fill="url(#jz-hair)" stroke="#6B4A32" stroke-width="3" stroke-linejoin="round"/>
  <!-- 머릿결 -->
  <g fill="none" stroke="#7B4A28" stroke-linecap="round" opacity="0.35">
    <path d="M68 40 C62 54, 62 74, 67 88" stroke-width="2"/>
    <path d="M132 40 C138 54, 138 74, 133 88" stroke-width="2"/>
  </g>

  <!-- ═══ 몸 (겉옷) ═══ -->
  <path d="M100 90
           C88 90, 80 95, 76 104
           C71 117, 69 135, 68 152
           C67 162, 66 168, 66 171
           L134 171
           C134 168, 133 162, 132 152
           C131 135, 129 117, 124 104
           C120 95, 112 90, 100 90 Z"
        fill="url(#jz-robe)" stroke="#6B4A32" stroke-width="3" stroke-linejoin="round"/>

  <!-- ═══ 활짝 벌린 두 팔 (★ 포인트) ═══ -->
  <g fill="url(#jz-robe)" stroke="#6B4A32" stroke-width="3" stroke-linejoin="round">
    <!-- 왼 소매 -->
    <path d="M82 100
             C70 98, 54 99, 41 104
             C35 106.5, 35 113.5, 41 115.5
             C48 118, 57 116.5, 66 117.5
             C73 118, 78 118, 82 118 Z"/>
    <!-- 오른 소매 -->
    <path d="M118 100
             C130 98, 146 99, 159 104
             C165 106.5, 165 113.5, 159 115.5
             C152 118, 143 116.5, 134 117.5
             C127 118, 122 118, 118 118 Z"/>
  </g>
  <!-- 소매 접힘선 -->
  <g fill="none" stroke="#C9B78A" stroke-width="2" stroke-linecap="round">
    <path d="M48 104 C46 109, 46 112, 48 116"/>
    <path d="M152 104 C154 109, 154 112, 152 116"/>
  </g>

  <!-- 펼친 손 (레퍼런스대로 — 두툼하고 둥근 손가락이 활짝)
       외곽선을 먼저 두껍게 깔고 그 위에 살색을 얇게 덮어 손가락 테두리를 만든다 -->
  <!-- 1) 외곽선 레이어 -->
  <g stroke="#6B4A32" stroke-width="13.5" stroke-linecap="round" fill="none">
    <!-- 왼손 손가락 4개 + 엄지 -->
    <path d="M27 107 C21 104, 17 101, 13 99"/>
    <path d="M23 111 C17 109, 12 107, 7.5 106"/>
    <path d="M23 116 C17 116, 12 116, 7.5 116.5"/>
    <path d="M26 120 C22 122, 18 124, 14.5 126"/>
    <path d="M33 106 C34 102, 35 99, 36 96.5"/>
    <!-- 오른손 -->
    <path d="M173 107 C179 104, 183 101, 187 99"/>
    <path d="M177 111 C183 109, 188 107, 192.5 106"/>
    <path d="M177 116 C183 116, 188 116, 192.5 116.5"/>
    <path d="M174 120 C178 122, 182 124, 185.5 126"/>
    <path d="M167 106 C166 102, 165 99, 164 96.5"/>
  </g>
  <circle cx="30"  cy="113" r="13" fill="#6B4A32"/>
  <circle cx="170" cy="113" r="13" fill="#6B4A32"/>

  <!-- 2) 살색 레이어 -->
  <g stroke="url(#jz-skin)" stroke-width="8.5" stroke-linecap="round" fill="none">
    <path d="M27 107 C21 104, 17 101, 13 99"/>
    <path d="M23 111 C17 109, 12 107, 7.5 106"/>
    <path d="M23 116 C17 116, 12 116, 7.5 116.5"/>
    <path d="M26 120 C22 122, 18 124, 14.5 126"/>
    <path d="M33 106 C34 102, 35 99, 36 96.5"/>
    <path d="M173 107 C179 104, 183 101, 187 99"/>
    <path d="M177 111 C183 109, 188 107, 192.5 106"/>
    <path d="M177 116 C183 116, 188 116, 192.5 116.5"/>
    <path d="M174 120 C178 122, 182 124, 185.5 126"/>
    <path d="M167 106 C166 102, 165 99, 164 96.5"/>
  </g>
  <circle cx="30"  cy="113" r="10.3" fill="url(#jz-skin)"/>
  <circle cx="170" cy="113" r="10.3" fill="url(#jz-skin)"/>

  <!-- ═══ 어깨 띠 (sash — 왼 어깨에서 오른 허리로) ═══ -->
  <path d="M85 94
           L98 91
           C103 111, 115 130, 133 141
           L128 155
           C106 144, 90 118, 85 94 Z"
        fill="url(#jz-sash)" stroke="#6B4A32" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- 띠 자락 -->
  <path d="M128 155
           C133 161, 131 168, 127 172
           L114 172
           C120 166, 122 160, 120 154 Z"
        fill="url(#jz-sash)" stroke="#6B4A32" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- 옷 주름 -->
  <path d="M86 130 C84 145, 83 160, 83 169" fill="none" stroke="#C9B78A" stroke-width="2" stroke-linecap="round"/>

  <!-- ═══ 발 + 샌달 ═══ -->
  <g>
    <path d="M85 166 L85 179 C85 182, 97 182, 97 179 L97 166 Z" fill="url(#jz-skin)" stroke="#6B4A32" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M103 166 L103 179 C103 182, 115 182, 115 179 L115 166 Z" fill="url(#jz-skin)" stroke="#6B4A32" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M80 179 C80 177, 98 177, 98 179 C98 187, 94 190, 89 190 C83 190, 80 186, 80 179 Z"
          fill="url(#jz-sandal)" stroke="#6B4A32" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M102 179 C102 177, 120 177, 120 179 C120 187, 117 190, 111 190 C106 190, 102 187, 102 179 Z"
          fill="url(#jz-sandal)" stroke="#6B4A32" stroke-width="2.6" stroke-linejoin="round"/>
    <g fill="none" stroke="#6B4A32" stroke-width="2" stroke-linecap="round">
      <path d="M82 183 L96 183"/>
      <path d="M104 183 L118 183"/>
    </g>
  </g>

  <!-- ═══ 얼굴 ═══ -->
  <ellipse cx="100" cy="54" rx="25" ry="26" fill="url(#jz-skin)" stroke="#6B4A32" stroke-width="2.8"/>

  <!-- 수염 (콧수염 + 턱수염이 얼굴을 둥글게 감싼다 · 입 자리는 비움) -->
  <path d="M75 50
           C73 68, 78 84, 89 91
           C93 93.5, 96.5 94.5, 100 94.5
           C103.5 94.5, 107 93.5, 111 91
           C122 84, 127 68, 125 50
           C124 63, 120 72, 113 76
           C111 69, 107 65, 100 65
           C93 65, 89 69, 87 76
           C80 72, 76 63, 75 50 Z"
        fill="url(#jz-hair)" stroke="#6B4A32" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- 앞머리 (물결진 앞머리 · 가운데에서 갈라짐) -->
  <path d="M75 46
           C76 29, 86 22, 100 22
           C114 22, 124 29, 125 46
           C122 37, 117 32, 111 31
           C113 35, 112 39, 109 41
           C107.5 34, 102.5 30, 96 30
           C90 31, 85 35, 82 41
           C79.5 39, 77 42, 75 46 Z"
        fill="url(#jz-hair)" stroke="#6B4A32" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- 눈썹 -->
  <g fill="none" stroke="#6B4A32" stroke-width="2.8" stroke-linecap="round">
    <path d="M84 42 C87 38.5, 93 38.5, 96 41.5"/>
    <path d="M104 41.5 C107 38.5, 113 38.5, 116 42"/>
  </g>

  <!-- 눈 (웃는 반달) -->
  <g fill="none" stroke="#6B4A32" stroke-width="3.2" stroke-linecap="round">
    <path d="M85 53 C88 47.6, 93 47.6, 96 53"/>
    <path d="M104 53 C107 47.6, 112 47.6, 115 53"/>
  </g>

  <!-- 볼터치 -->
  <ellipse cx="79"  cy="58" rx="5.4" ry="3.4" fill="#F5A98A" opacity="0.85"/>
  <ellipse cx="121" cy="58" rx="5.4" ry="3.4" fill="#F5A98A" opacity="0.85"/>

  <!-- 코 -->
  <path d="M100 57 C98.6 60.4, 98.4 62, 100.8 62.6"
        fill="none" stroke="#D9A57C" stroke-width="2" stroke-linecap="round"/>

  <!-- 활짝 웃는 입 (수염 위에 그려 확실히 보인다) -->
  <path d="M89 67
           C94 64.4, 106 64.4, 111 67
           C110 79, 105.5 83, 100 83
           C94.5 83, 90 79, 89 67 Z"
        fill="#E8563F" stroke="#6B4A32" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- 윗니 -->
  <path d="M90.6 67.8 C95 65.8, 105 65.8, 109.4 67.8 C109 70.8, 91 70.8, 90.6 67.8 Z" fill="#FFFDF7"/>
  <!-- 혀 -->
  <path d="M95 77 C97 74.4, 103 74.4, 105 77 C104 80, 96 80, 95 77 Z" fill="#F58A8A"/>
</svg>
