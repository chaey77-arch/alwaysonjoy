<!-- 산뜻 발랄 캐릭터 "기쁨이" — 비둘기 모티프 (성령/평화)
     색은 currentColor 를 쓰지 않고 테마별 CSS 로 덮어쓸 수 있게 class 를 달았다 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" class="joy-char">
  <defs>
    <radialGradient id="jc-body" cx="42%" cy="32%" r="72%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8F4FF"/>
    </radialGradient>
    <linearGradient id="jc-wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D6ECFB"/>
    </linearGradient>
    <linearGradient id="jc-halo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FFE08A"/>
      <stop offset="50%"  stop-color="#FFD05C"/>
      <stop offset="100%" stop-color="#FFE08A"/>
    </linearGradient>
  </defs>

  <!-- 반짝임 (배경) -->
  <g class="jc-sparkles" fill="#FFD05C">
    <path d="M32 42 l3.5 8 8 3.5 -8 3.5 -3.5 8 -3.5 -8 -8 -3.5 8 -3.5z" opacity="0.85"/>
    <path d="M170 62 l2.8 6.4 6.4 2.8 -6.4 2.8 -2.8 6.4 -2.8 -6.4 -6.4 -2.8 6.4 -2.8z" opacity="0.7"/>
    <path d="M158 26 l2 4.6 4.6 2 -4.6 2 -2 4.6 -2 -4.6 -4.6 -2 4.6 -2z" opacity="0.55"/>
  </g>

  <!-- 후광 -->
  <ellipse cx="100" cy="34" rx="30" ry="9" fill="none" stroke="url(#jc-halo)" stroke-width="6" opacity="0.9"/>

  <!-- 꼬리 -->
  <path d="M138 128 q28 6 40 26 q-24 4 -40 -8z" fill="url(#jc-wing)" stroke="#BBDCF2" stroke-width="2" stroke-linejoin="round"/>

  <!-- 몸통 -->
  <ellipse cx="98" cy="112" rx="46" ry="42" fill="url(#jc-body)" stroke="#BBDCF2" stroke-width="2.5"/>

  <!-- 날개 (살짝 든 모습 — 발랄함) -->
  <path class="jc-wing" d="M92 100 q-34 -22 -54 -6 q6 30 34 36 q18 3 24 -12z"
        fill="url(#jc-wing)" stroke="#BBDCF2" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M52 104 q16 6 26 18" fill="none" stroke="#CFE6F7" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M58 94 q16 8 24 20"  fill="none" stroke="#CFE6F7" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- 머리 -->
  <circle cx="120" cy="72" r="30" fill="url(#jc-body)" stroke="#BBDCF2" stroke-width="2.5"/>

  <!-- 눈 (웃는 반달 — 발랄) -->
  <path d="M110 68 q5 -6 10 0" fill="none" stroke="#2C4356" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M130 68 q5 -6 10 0" fill="none" stroke="#2C4356" stroke-width="3.4" stroke-linecap="round"/>

  <!-- 볼터치 -->
  <ellipse class="jc-cheek" cx="107" cy="80" rx="6" ry="4" fill="#FFAEC0" opacity="0.75"/>
  <ellipse class="jc-cheek" cx="143" cy="80" rx="6" ry="4" fill="#FFAEC0" opacity="0.75"/>

  <!-- 부리 (웃는 입) -->
  <path d="M146 74 l14 5 -14 5z" fill="#FFB84D" stroke="#F0A030" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- 올리브 가지 (평화) -->
  <g class="jc-branch">
    <path d="M96 146 q14 14 34 16" fill="none" stroke="#6BBF8A" stroke-width="3.5" stroke-linecap="round"/>
    <ellipse cx="112" cy="152" rx="8" ry="5" fill="#8FD3A6" transform="rotate(28 112 152)"/>
    <ellipse cx="124" cy="159" rx="8" ry="5" fill="#6BBF8A" transform="rotate(20 124 159)"/>
    <ellipse cx="104" cy="146" rx="7" ry="4.5" fill="#A9E0BB" transform="rotate(35 104 146)"/>
  </g>
</svg>
